<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Hello Kitty Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#ffb3d9;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;}
#gw{position:relative;width:480px;height:560px;border-radius:20px;overflow:hidden;box-shadow:0 16px 48px rgba(200,0,100,.4),0 0 0 4px #ff85c2;}
canvas{display:block;width:100%;height:100%;}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,220,240,.95);backdrop-filter:blur(6px);z-index:20;}
.ov.hide{display:none;}
.ov h1{font-family:'Fredoka One',cursive;font-size:2.2rem;color:#cc0055;text-shadow:2px 2px 0 #ffaad4;text-align:center;line-height:1.2;margin-bottom:6px;}
.sub{font-size:.85rem;color:#aa3366;font-weight:700;margin-bottom:20px;}
.ki{font-size:4rem;margin-bottom:8px;display:block;animation:bou 1.2s ease-in-out infinite;}
@keyframes bou{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.btn{background:linear-gradient(135deg,#ff6eb4,#ee1166);color:#fff;border:none;padding:11px 36px;border-radius:50px;font-family:'Fredoka One',cursive;font-size:1.15rem;cursor:pointer;box-shadow:0 5px 18px rgba(220,0,100,.45);transition:transform .12s;}
.btn:active{transform:scale(.93);}
#hud{position:absolute;top:0;left:0;right:0;height:40px;background:rgba(255,235,248,.92);border-bottom:2px solid #ffbbdd;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:10;pointer-events:none;}
.hd{font-family:'Fredoka One',cursive;font-size:.85rem;color:#bb0044;}
#prog{position:absolute;top:40px;left:0;right:0;height:4px;background:rgba(255,150,200,.3);z-index:10;}
#progF{height:4px;background:linear-gradient(90deg,#ff6eb4,#ee1166);width:0%;transition:width .4s;}
#hbar{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;display:flex;gap:2px;flex-wrap:wrap;max-width:460px;justify-content:center;}
.hr{font-size:.9rem;}.hr.dim{opacity:.25;filter:grayscale(1);}
#ctrl{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:10;}
.cg{display:flex;gap:10px;}
.cb{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(255,90,160,.68);color:#fff;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;backdrop-filter:blur(3px);touch-action:manipulation;}
.cb.on{background:rgba(220,10,90,.88);transform:scale(.88);}
.jb{width:64px;height:64px;font-size:1.7rem;background:rgba(220,30,100,.78);}
.pop{position:absolute;font-family:'Fredoka One',cursive;font-size:1.1rem;color:#ee1166;pointer-events:none;z-index:15;animation:pu .85s forwards;transform:translateX(-50%);text-shadow:0 0 4px #fff;}
@keyframes pu{0%{opacity:1;transform:translateX(-50%) translateY(0);}100%{opacity:0;transform:translateX(-50%) translateY(-44px) scale(1.4);}}
#si{font-size:.9rem;color:#bb3366;font-weight:800;margin-bottom:14px;}
#fs{font-family:'Fredoka One',cursive;font-size:1.5rem;color:#ee1166;margin-bottom:4px;}
#hs{font-size:.85rem;color:#aa3366;margin-bottom:20px;font-weight:700;}
</style>
</head>
<body>
<div id="gw">
  <canvas id="gc" width="480" height="560"></canvas>
  <div id="hud">
    <div class="hd">⭐<span id="eSc">0</span></div>
    <div class="hd">Màn <span id="eLv">1</span>/50</div>
    <div class="hd">💗<span id="eHc">0</span>/<span id="eHt">3</span></div>
  </div>
  <div id="prog"><div id="progF"></div></div>
  <div id="hbar"></div>
  <div id="ctrl">
    <div class="cg">
      <div class="cb" id="bL">◀</div>
      <div class="cb" id="bR">▶</div>
    </div>
    <div class="jb cb" id="bJ">↑</div>
  </div>
  <div class="ov" id="ovS">
    <span class="ki">🐱</span>
    <h1>Hello Kitty<br>Adventure!</h1>
    <div class="sub">Thu 💗 đủ số để qua màn · Tránh 🪨🌵</div>
    <button class="btn" id="btnS">🚗 Bắt đầu!</button>
  </div>
  <div class="ov hide" id="ovC">
    <span class="ki">🎉</span>
    <h1>Qua màn!</h1>
    <div id="si"></div>
    <button class="btn" id="btnN">➡ Tiếp theo</button>
  </div>
  <div class="ov hide" id="ovO">
    <span class="ki">😿</span>
    <h1>Ôi không!</h1>
    <div id="fs"></div>
    <div id="hs"></div>
    <button class="btn" id="btnR">🔄 Chơi lại</button>
  </div>
</div>

// ─── LCG random ───
function makeLCG(seed){
  let s=(seed*7919+12345)>>>0;
  return ()=>{s=(s*1664525+1013904223)>>>0;return s/0x100000000;};
}

// ─── Stage generator ───
function makeStage(i){
  const lvl=i+1, diff=i/49;
  const rng=makeLCG(lvl*31+7);
  const heartsNeeded=3+Math.floor(diff*12); // 3→15
  const segN=3+Math.floor(diff*13);         // 3→16
  const maxRise=Math.floor(40+diff*90);     // 40→130
  const maxGap=Math.floor(28+diff*55);      // 28→83

  const bgPals=[
    ['#4ec8f0','#c8eeff'],['#f0a0d8','#ffe0f4'],
    ['#90b8ff','#d8e8ff'],['#ffd870','#fff8d8'],
    ['#a0e890','#d8ffc8']
  ];
  const gcols=['#5ec840','#6edc50','#4ec030','#60d044','#68d84c'];
  const pi=Math.floor(i/10)%5;

  // Build segment list
  const segs=[{t:'flat',l:180}];
  const pool=['flat','flat','up','down','bridge'];
  if(lvl>12) pool.push('up','down');
  if(lvl>22) pool.push('bridge');
  if(lvl>35) pool.push('bridge','up');
  let last='flat';
  for(let k=0;k<segN;k++){
    let tp,tries=0;
    do{tp=pool[Math.floor(rng()*pool.length)];tries++;}
    while(tp==='bridge'&&last==='bridge'&&tries<8);
    last=tp;
    if(tp==='flat'){
      segs.push({t:'flat',l:80+Math.floor(rng()*(80+lvl*4))});
    } else if(tp==='up'){
      const r=30+Math.floor(rng()*maxRise);
      segs.push({t:'up',l:Math.floor(r*1.6+40),r});
    } else if(tp==='down'){
      const d=30+Math.floor(rng()*maxRise);
      segs.push({t:'down',l:Math.floor(d*1.6+40),d});
    } else {
      const g=26+Math.floor(rng()*maxGap);
      segs.push({t:'bridge',l:g+80+Math.floor(rng()*50),g});
    }
  }
  segs.push({t:'flat',l:260});
  return{lvl,heartsNeeded,bgPal:bgPals[pi],gcol:gcols[pi],segs};
}

const STAGES=Array.from({length:50},(_,i)=>makeStage(i));

// ─── Build terrain points ───
// Returns surface pts in WORLD coords, y=0 at top of play area
// Ground base at GROUND_BASE world-y
const GROUND_BASE=320; // world y of default ground (in world space)

function buildTerrain(stage){
  const pts=[], bridges=[];
  let cx=0, cy=GROUND_BASE;
  pts.push({x:cx,y:cy});

  for(const s of stage.segs){
    if(s.t==='flat'){
      cx+=s.l; pts.push({x:cx,y:cy});
    } else if(s.t==='up'){
      cy-=s.r; cx+=s.l; pts.push({x:cx,y:cy});
    } else if(s.t==='down'){
      cy=Math.min(cy+s.d, GROUND_BASE+120);
      cx+=s.l; pts.push({x:cx,y:cy});
    } else { // bridge
      const gs=cx+(s.l-s.g)/2, ge=gs+s.g;
      const pitY=cy+110;
      pts.push({x:gs,y:cy});
      pts.push({x:gs+1,y:pitY});
      pts.push({x:ge-1,y:pitY});
      pts.push({x:ge,y:cy});
      cx+=s.l; pts.push({x:cx,y:cy});
      bridges.push({x1:gs,x2:ge,y:cy});
    }
  }
  cx+=300; pts.push({x:cx,y:cy});
  // close polygon
  pts.push({x:cx,y:cy+600});
  pts.push({x:-200,y:cy+600});
  return{pts,bridges,flagX:cx-260,flagY:cy};
}

function terrainY(wx,pts){
  for(let i=0;i<pts.length-3;i++){
    const a=pts[i],b=pts[i+1];
    if(b.x>a.x&&wx>=a.x&&wx<b.x){
      const t=(wx-a.x)/(b.x-a.x);
      return a.y+(b.y-a.y)*t;
    }
  }
  return GROUND_BASE;
}
function terrainAngle(wx,pts){
  for(let i=0;i<pts.length-3;i++){
    const a=pts[i],b=pts[i+1];
    if(b.x>a.x&&wx>=a.x&&wx<b.x)
      return Math.atan2(b.y-a.y,b.x-a.x);
  }
  return 0;
}

// ─── Place hearts & obstacles ───
function placeItems(pts,stage,rng){
  const need=stage.heartsNeeded;
  // Collect walkable surface samples
  const surf=[];
  for(let i=0;i<pts.length-3;i++){
    const a=pts[i],b=pts[i+1];
    if(b.x>a.x){
      const slope=Math.abs(b.y-a.y)/(b.x-a.x);
      if(slope<1.5){
        for(let t=0.1;t<0.95;t+=0.12){
          const x=a.x+(b.x-a.x)*t, y=a.y+(b.y-a.y)*t;
          if(y<GROUND_BASE+130) surf.push({x,y:y-44});
        }
      }
    }
  }
  surf.sort((a,b)=>a.x-b.x);

  // Hearts on map: early levels slightly more than needed, late levels = exact (must find all)
  const diff=(stage.lvl-1)/49;
  const extra=Math.max(0, Math.round(3-diff*3)); // lvl1: +3 extra, lvl20+: 0 extra
  const totalOnMap=stage.heartsNeeded+extra;

  // Spacing: hearts very sparse — min 300px early, 500px late
  const minGap=Math.floor(300+diff*200); // 300→500px

  const hearts=[];
  let lx=-999;
  for(const p of surf){
    if(p.x>200&&p.x-lx>=minGap){
      hearts.push({x:p.x,y:p.y,bob:rng()*Math.PI*2,collected:false});
      lx=p.x;
      if(hearts.length>=totalOnMap) break;
    }
  }

  return{hearts,obs:[]};
}

let hearts=[],obs=[],parts=[];

// ─── Input ───
const K={};
document.addEventListener('keydown',e=>{K[e.key]=true;if([' ','ArrowLeft','ArrowRight','ArrowUp'].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>K[e.key]=false);
function mkBtn(id,key){
  const el=document.getElementById(id);
  const on=()=>{K[key]=true;el.classList.add('on');};
  const off=()=>{K[key]=false;el.classList.remove('on');};
  el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
mkBtn('bL','ArrowLeft'); mkBtn('bR','ArrowRight'); mkBtn('bJ','ArrowUp');

// ─── Init ───
function initStage(idx){
  const st=STAGES[idx];
  const rng=makeLCG(st.lvl*53+17);
  terrain=buildTerrain(st);
  const pl2=placeItems(terrain.pts,st,rng);
  hearts=pl2.hearts; obs=pl2.obs;
  hGot=0; frame=0; parts=[]; happyT=0;

  // Player starts on terrain
  const startFoot=terrainY(120,terrain.pts);
  pl={x:72,y:startFoot-PH2,vx:0,vy:0,onGround:false,facing:1,tilt:0};

  // Camera: start snapped (no lerp lag at start)
  const initCamX=pl.x+PW/2-W*0.35;
  const initCamY=startFoot - (HUD + PH*0.72);
  camX=Math.max(0,initCamX);
  camY=initCamY;

  // BG elements
  clouds=Array.from({length:7},(_,i)=>({
    wx:i*120+rng()*80, y:HUD+20+rng()*60, w:55+rng()*55, spd:.08+rng()*.07
  }));
  bgtrees=Array.from({length:14},(_,i)=>({
    wx:100+i*140+rng()*80, tp:rng()<.55?'tree':'bush'
  }));

  refreshHUD();
}

function refreshHUD(){
  const st=STAGES[si];
  document.getElementById('eSc').textContent=score;
  document.getElementById('eLv').textContent=st.lvl;
  document.getElementById('eHc').textContent=hGot;
  document.getElementById('eHt').textContent=st.heartsNeeded;
  document.getElementById('progF').style.width=Math.max(1,(si/50*100))+'%';
  const bar=document.getElementById('hbar');
  bar.innerHTML='';
  for(let i=0;i<st.heartsNeeded;i++){
    const s=document.createElement('span');
    s.className='hr'+(i<hGot?'':' dim');
    s.textContent='💗'; bar.appendChild(s);
  }
}

// ─── Camera ───
// World → screen:  screenX = worldX - camX,  screenY = worldY - camY + HUD
function w2sx(wx){return wx-camX;}
function w2sy(wy){return wy-camY+HUD;}

// ─── Draw background ───
function drawBg(){
  const st=STAGES[si];
  // Sky
  const g=ctx.createLinearGradient(0,HUD,0,H-CTRL);
  g.addColorStop(0,st.bgPal[0]); g.addColorStop(1,st.bgPal[1]);
  ctx.fillStyle=g; ctx.fillRect(0,HUD,W,PH);

  // Sun
  ctx.fillStyle='#ffe055';
  ctx.beginPath(); ctx.arc(W-52,HUD+54,24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(W-59,HUD+49,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W-45,HUD+49,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W-52,HUD+57,4,0,Math.PI); ctx.fill();

  // Clouds (slow parallax, loop)
  const mv=K['ArrowLeft']?-1:K['ArrowRight']?1:0;
  clouds.forEach(c=>{
    if(mv) c.wx-=mv*c.spd;
    // screen x with very slow cam parallax
    const sx=((c.wx-camX*.08)%W+W+W)%W;
    drawCloud(sx,c.y,c.w);
    if(sx+c.w>W) drawCloud(sx-W,c.y,c.w);
  });

  // Background trees (medium parallax)
  bgtrees.forEach(t=>{
    const sx=t.wx - camX*0.22;
    const normSx=((sx%(W+300))+(W+300))%(W+300)-150;
    const sy=w2sy(GROUND_BASE)-4;
    if(t.tp==='tree') drawBgTree(normSx,sy); else drawBgBush(normSx,sy);
  });
}

function drawCloud(x,y,w){
  ctx.fillStyle='rgba(255,255,255,.86)';
  ctx.beginPath(); ctx.ellipse(x+w*.5,y,w*.38,w*.19,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+w*.25,y+w*.04,w*.25,w*.14,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+w*.75,y+w*.05,w*.22,w*.13,0,0,Math.PI*2); ctx.fill();
}
function drawBgTree(x,y){
  ctx.fillStyle='#7a4e2d'; ctx.fillRect(x-4,y-48,8,48);
  ctx.fillStyle='#259029'; ctx.beginPath(); ctx.ellipse(x,y-60,19,25,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#35b035'; ctx.beginPath(); ctx.ellipse(x-4,y-70,13,17,-.3,0,Math.PI*2); ctx.fill();
}
function drawBgBush(x,y){
  ctx.fillStyle='#36a036'; ctx.beginPath(); ctx.ellipse(x,y-11,17,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#48c048'; ctx.beginPath(); ctx.ellipse(x-7,y-13,11,9,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+7,y-12,10,8,0,0,Math.PI*2); ctx.fill();
}

// ─── Draw terrain ───
function drawTerrain(){
  const st=STAGES[si];
  ctx.save();
  // clip to play area
  ctx.beginPath(); ctx.rect(0,HUD,W,PH); ctx.clip();
  ctx.translate(-camX,-camY+HUD);

  // Ground polygon
  ctx.beginPath();
  ctx.moveTo(terrain.pts[0].x,terrain.pts[0].y);
  for(let i=1;i<terrain.pts.length;i++) ctx.lineTo(terrain.pts[i].x,terrain.pts[i].y);
  ctx.closePath();
  const gg=ctx.createLinearGradient(0,GROUND_BASE-20,0,GROUND_BASE+250);
  gg.addColorStop(0,st.gcol); gg.addColorStop(.25,'#3e9430'); gg.addColorStop(1,'#245a18');
  ctx.fillStyle=gg; ctx.fill();

  // Grass top
  ctx.strokeStyle='#82e855'; ctx.lineWidth=5; ctx.setLineDash([]);
  ctx.beginPath();
  // only surface pts (skip last 2 closing pts)
  const spts=terrain.pts.slice(0,terrain.pts.length-2);
  ctx.moveTo(spts[0].x,spts[0].y);
  for(let i=1;i<spts.length;i++) ctx.lineTo(spts[i].x,spts[i].y);
  ctx.stroke();

  // Bridges
  terrain.bridges.forEach(b=>{
    const bw=b.x2-b.x1;
    ctx.fillStyle='#c49850'; ctx.fillRect(b.x1,b.y-10,bw,10);
    ctx.fillStyle='#b08040';
    for(let px=b.x1+6;px<b.x2;px+=15) ctx.fillRect(px,b.y-10,9,10);
    ctx.fillStyle='#906020';
    ctx.fillRect(b.x1,b.y-18,5,18); ctx.fillRect(b.x2-5,b.y-18,5,18);
    ctx.fillRect(b.x1,b.y-18,bw,4);
    for(let px=b.x1+18;px<b.x2-10;px+=26){
      ctx.fillRect(px,b.y-18,4,14);
    }
    ctx.fillRect(b.x1+8,b.y,7,35); ctx.fillRect(b.x2-15,b.y,7,35);
  });

  // Finish flag
  if(terrain.flagX){
    const fx=terrain.flagX, fy=terrain.flagY;
    // Pole
    ctx.fillStyle='#555'; ctx.fillRect(fx-3,fy-80,6,80);
    // Flag body
    ctx.fillStyle='#ff1a6e';
    ctx.beginPath(); ctx.moveTo(fx+3,fy-80); ctx.lineTo(fx+44,fy-65); ctx.lineTo(fx+3,fy-50); ctx.fill();
    // Checkerboard pattern on flag
    ctx.fillStyle='#fff';
    [[0,0],[1,1],[2,0],[3,1],[0,2],[1,3],[2,2],[3,3]].forEach(([c,r])=>{
      ctx.fillRect(fx+4+c*9, fy-79+r*7, 9, 7);
    });
    // GOAL text
    ctx.fillStyle='#fff'; ctx.font='bold 11px Nunito,sans-serif'; ctx.textAlign='center';
    ctx.fillText('GOAL!', fx+20, fy-84);
    // Glow when all hearts collected
    if(hGot>=STAGES[si].heartsNeeded){
      ctx.strokeStyle='rgba(255,220,0,0.7)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(fx,fy-40,30,0,Math.PI*2); ctx.stroke();
    }
  }
  ctx.restore();
}

// ─── Draw hearts & obstacles ───
function drawHearts(){
  ctx.save();
  ctx.beginPath(); ctx.rect(0,HUD,W,PH); ctx.clip();
  hearts.forEach(h=>{
    if(h.collected)return;
    const bob=Math.sin(frame*.09+h.bob)*5;
    const sx=w2sx(h.x), sy=w2sy(h.y+bob);
    if(sx<-30||sx>W+30||sy<HUD-20||sy>H) return;
    ctx.font='24px serif'; ctx.textAlign='center';
    ctx.fillText('💗',sx,sy);
    ctx.strokeStyle='rgba(255,60,150,.3)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy-7,15,0,Math.PI*2); ctx.stroke();
  });
  ctx.restore();
}


// ─── Draw player ───
function drawPlayer(){
  const sx=w2sx(pl.x), sy=w2sy(pl.y);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,HUD,W,PH); ctx.clip();
  ctx.translate(sx+PW/2, sy+PH2);
  ctx.rotate(pl.tilt);
  ctx.scale(pl.facing===-1?-1:1,1);

  if(carOk){
    ctx.drawImage(carI,-PW/2,-PH2,PW,PH2);
    // Wheel spin overlays
    const sc=PW/195, wr=20*sc;
    const drawW=(wx,wy)=>{
      ctx.save(); ctx.translate(wx,wy); ctx.rotate(wAngle);
      ctx.strokeStyle='rgba(150,20,20,.6)'; ctx.lineWidth=2.5*sc;
      for(let a=0;a<Math.PI*2;a+=Math.PI/3){
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*wr*.76,Math.sin(a)*wr*.76); ctx.stroke();
      }
      ctx.fillStyle='#aa1111';
      ctx.beginPath(); ctx.arc(0,0,3*sc,0,Math.PI*2); ctx.fill();
      ctx.restore();
    };
    drawW(-PW/2+PW*.27,-PH2*.13);
    drawW(-PW/2+PW*.73,-PH2*.13);
    if(happyT>0){
      ctx.globalAlpha=Math.min(1,happyT/10);
      ctx.font=(22*sc)+'px serif'; ctx.textAlign='center';
      ctx.fillText('😊',0,-PH2*.78);
      ctx.globalAlpha=1;
    }
  } else {
    ctx.fillStyle='#1a55cc';
    ctx.beginPath(); ctx.roundRect(-PW/2,-PH2+8,PW,PH2-8,10); ctx.fill();
    ctx.font='22px serif'; ctx.textAlign='center'; ctx.fillText('🐱',0,-PH2/2);
  }
  ctx.restore();
}

// ─── Draw particles ───
function drawParts(){
  parts.forEach(p=>{
    const sx=w2sx(p.x), sy=w2sy(p.y);
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(sx,sy,p.sz*p.life,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ─── Burst & popup ───
function burst(wx,wy,col,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*3.5;
    parts.push({x:wx,y:wy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,color:col,life:1,sz:3+Math.random()*4.5});
  }
}
function popup(wx,wy,txt){
  const el=document.createElement('div'); el.className='pop'; el.textContent=txt;
  el.style.left=w2sx(wx)/W*100+'%';
  el.style.top=w2sy(wy)/H*100+'%';
  document.getElementById('gw').appendChild(el);
  setTimeout(()=>el.remove(),880);
}

// ─── Physics ───
function updatePhysics(){
  // Horizontal
  if(K['ArrowLeft']){pl.vx=-SPD; pl.facing=-1;}
  else if(K['ArrowRight']){pl.vx=SPD; pl.facing=1;}
  else pl.vx*=0.65;
  // Jump
  if((K['ArrowUp']||K[' '])&&pl.onGround){
    pl.vy=JUMP; pl.onGround=false;
    burst(pl.x+PW/2,pl.y+PH2,'#ffd0ee',6);
  }
  pl.vy+=GRAV;
  pl.x+=pl.vx;
  pl.y+=pl.vy;
  if(pl.x<8) pl.x=8;

  // Terrain collision (foot center)
  const fx=pl.x+PW/2;
  const ty=terrainY(fx,terrain.pts);
  if(pl.y+PH2>=ty){
    pl.y=ty-PH2; pl.vy=0; pl.onGround=true;
  } else {
    pl.onGround=false;
  }

  // Tilt
  const ang=terrainAngle(fx,terrain.pts);
  pl.tilt+=(ang*.5-pl.tilt)*.15;

  // Wheel
  if(K['ArrowLeft']||K['ArrowRight']) wAngle+=pl.facing*.19;
  if(happyT>0) happyT--;

  // ─── Camera: track player in world space ───
  // Target: player foot at 65% of play area height, player at 38% of width
  const tCX=pl.x+PW/2 - W*0.38;
  const tCY=terrainY(fx,terrain.pts) - (PH*0.70);
  camX+=(Math.max(0,tCX)-camX)*.10;
  camY+=(tCY-camY)*.10;
}

// ─── Collision ───
function checkCol(){
  const px=pl.x+12, py=pl.y+10, pw=PW-24, ph=PH2-10;
  const cx=px+pw/2, cy=py+ph/2;
  // Hearts
  hearts.forEach(h=>{
    if(h.collected)return;
    if(Math.abs(h.x-cx)<pw/2+20&&Math.abs(h.y-cy)<ph/2+20){
      h.collected=true; hGot++; score+=10; happyT=55;
      burst(h.x,h.y,'#ff5599',14);
      popup(h.x,h.y-32,'💗 +10');
      refreshHUD();
      if(hGot>=STAGES[si].heartsNeeded) popup(pl.x+PW/2, pl.y-20, '🏁 Đến đích nào!');
    }
  });

  // Fell off
  if(w2sy(pl.y)>H+120){ burst(cx,H-30,'#aaaaff',14); setTimeout(doOver,200); }
  // Reach finish flag
  if(terrain.flagX && Math.abs((pl.x+PW/2)-terrain.flagX)<48 && pl.y+PH2>=terrain.flagY-15){
    if(hGot>=STAGES[si].heartsNeeded){
      setTimeout(doClear,300);
    } else {
      // Bounce player back with message
      if(!pl._flagMsg){
        pl._flagMsg=true;
        popup(terrain.flagX, terrain.flagY-90, '💗 Chưa đủ tim!');
        pl.vx=-4; pl.vy=-8;
        setTimeout(()=>{ pl._flagMsg=false; }, 2000);
      }
    }
  }
}

// ─── Stage clear / over ───
function doClear(){
  cancelAnimationFrame(aid); gameState='clear';
  const nxt=si+1<50;
  document.getElementById('si').textContent=
    nxt?`Màn ${si+1}/50 hoàn thành! 🎊`:'🏆 Bạn thắng cả 50 màn!';
  document.getElementById('btnN').textContent=nxt?'➡ Tiếp theo':'🔄 Chơi lại';
  document.getElementById('ovC').classList.remove('hide');
}
function doOver(){
  if(gameState==='over')return;
  gameState='over'; cancelAnimationFrame(aid);
  if(score>highScore)highScore=score;
  document.getElementById('fs').textContent='Điểm: '+score;
  document.getElementById('hs').textContent='🏆 Kỷ lục: '+highScore;
  document.getElementById('ovO').classList.remove('hide');
}

// ─── Game loop ───
function loop(){
  ctx.clearRect(0,0,W,H);

  // HUD bg (draw over canvas)
  ctx.fillStyle='rgba(255,235,248,.93)';
  ctx.fillRect(0,0,W,HUD);

  drawBg();
  drawTerrain();
  drawHearts();
  drawPlayer();
  drawParts();

  // HUD border line
  ctx.fillStyle='#ffbbdd'; ctx.fillRect(0,HUD-2,W,2);

  frame++;
  updatePhysics();
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.life-=.032;});
  parts=parts.filter(p=>p.life>0);
  checkCol();
  aid=requestAnimationFrame(loop);
}

// ─── Buttons ───
document.getElementById('btnS').onclick=()=>{
  document.getElementById('ovS').classList.add('hide');
  si=0;score=0;initStage(0);gameState='playing';loop();
};
document.getElementById('btnN').onclick=()=>{
  document.getElementById('ovC').classList.add('hide');
  if(si+1<50)si++; else{si=0;score=0;}
  initStage(si);gameState='playing';loop();
};
document.getElementById('btnR').onclick=()=>{
  document.getElementById('ovO').classList.add('hide');
  si=0;score=0;initStage(0);gameState='playing';loop();
};

// ─── Idle preview ───
(function idle(){
  if(gameState!=='start')return;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#4ec8f0'); g.addColorStop(1,'#c8eeff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5ec840'; ctx.fillRect(0,H-90,W,90);
  ctx.fillStyle='#82e855'; ctx.fillRect(0,H-90,W,6);
  if(carOk) ctx.drawImage(carI,55,H-88-PH2,PW,PH2);
  requestAnimationFrame(idle);
})();
</script>
